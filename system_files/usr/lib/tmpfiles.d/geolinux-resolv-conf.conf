# bootc install writes a regular /etc/resolv.conf (the build host's), so
# systemd's own tmpfiles rule (L, no "+") can never replace it with the stub
# symlink; NetworkManager runs with rc-manager=unmanaged and never writes it
# either, leaving DNS dead until someone fixes it by hand.
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf

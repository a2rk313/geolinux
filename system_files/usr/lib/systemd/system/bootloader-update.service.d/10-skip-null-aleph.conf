# bootupd 0.3.2 cannot parse .bootc-aleph.json when the image has no version
# and fails bootloader-update.service on every boot (coreos/bootupd#1166).
# Skip bootupctl only in that case; the unit's own ExecCondition still guards
# squashfs/erofs roots. Remove this drop-in once bootupd handles a null version.
[Service]
ExecCondition=/usr/libexec/geolinux-bootloader-check

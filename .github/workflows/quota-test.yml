---
name: Quota test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - run: head -c 1048576 /dev/urandom > /tmp/blob.bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quota-test
          path: /tmp/blob.bin
          if-no-files-found: error
